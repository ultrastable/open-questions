name: loop
# SPDX-License-Identifier: LicenseRef-Ultrastable-USL-1.0
# GH-ONLY-1: Open Questions runs on GitHub alone. Actions is the clock and the executor, Issues are the work queue, data/entries.json is the
# database, node:sqlite holds the beat ledger in the run, GitHub Models drafts (Hugging Face as the second route), github/verify.mjs decides,
# Pages is the front end. A run commits only when a verified entry is new; beats travel through the published site, never through commits.
# budget: ~1 min per run, 2 runs a day (public repository: Actions minutes are free); at most 2 model calls a run
# trigger: schedule twice a day, push to main, dispatch
# free-alternative: the same Worker code on Cloudflare (worker/index.js, wrangler.jsonc)
on:
  schedule:
    - cron: "13 3,15 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/entries.json"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
  pages: write
  id-token: write
concurrency:
  group: loop
  cancel-in-progress: false
jobs:
  run:
    if: ${{ vars.HALT != '1' }}  # HALT-1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24}
      - run: npm test
      - name: Find, draft and verify open questions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node github/loop.mjs
      - name: Commit a new entry, only when there is one
        run: |
          if git diff --quiet data/entries.json; then echo "no new entry, nothing committed"; exit 0; fi
          git config user.name "open-questions-loop"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(entries): publish verified open questions" data/entries.json
          git push
      - name: Build the site from the router
        run: node github/build.mjs
      - name: Publish the site to gh-pages (PAGES-NO-CLICK-1, a second route when Pages cannot be switched on by API)
        run: |
          set -e
          cd _site; touch .nojekyll
          git init -q -b gh-pages; git config user.name "${{ github.event.repository.name }}-loop"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A; git commit -qm "chore(site): publish build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Pages enable from gh-pages answered HTTP $code (201 on, 409 already on, 403/404 refused: the Cloudflare copy serves the site meanwhile)"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true  # the repo token cannot switch Pages on; ultrastable/ultrastable pages-enable.yml does it once
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: {path: _site}
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
